<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Registration</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #a8c6c6;
      color: #f0f0f0;
      padding: 20px;
    }

    table {
      margin: 30px auto;
      padding: 20px;
      border-collapse: collapse;
      background-color: #1e1e2f;
      border-radius: 10px;
      box-shadow: 0px 0px 20px #333;
      width: 80%;
    }

    h2 {
      background-color: #282c34;
      color: #00ffff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      text-shadow: 1px 1px 5px #000;
    }

    h3 {
      color: #ff69b4;
      margin-top: 20px;
      text-align: center;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select {
      width: 90%;
      padding: 10px;
      margin: 8px auto;
      display: block;
      border-radius: 6px;
      border: none;
      background-color: #2e2e3e;
      color: #f8f8f8;
      box-shadow: inset 0 0 5px #000;
    }

    input[type="radio"] {
      margin: 0 8px 0 20px;
    }

    label {
      display: inline-block;
      margin: 10px 5px 5px 0;
      font-weight: bold;
      color: #c0c0ff;
    }

    select {
      background-color: #3e3e5e;
    }

    form {
      width: 100%;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td align="center" valign="middle">
        <form action="">

          <h2>Employee Registration Form</h2>

          <input type="text" placeholder="Enter Your First Name:" />
          <input type="text" placeholder="Enter Your Middle Name:" />
          <input type="text" placeholder="Enter Your Last Name:" />

          <label for="marrige">Marital Status:</label>
          <select name="ma" id="marrige">
            <option value="1">Married</option>
            <option value="2">Un-Married</option>
          </select>

          <label for="bday">Date Of Birth:</label>
          <input type="date" id="bday" name="bday" />

          <label for="add">Full Address:</label>
          <input type="text" placeholder="Enter your address" />

          <h3>Gender Validation</h3>
          <label for="male">Male</label>
          <input type="radio" id="male" name="gender" value="male" />
          <label for="female">Female</label>
          <input type="radio" id="female" name="gender" value="female" />

          <label for="jTitle">Job Title:</label>
          <input type="text" placeholder="Job Title" />

          <label for="dept">Department:</label>
          <select name="Dept" id="deptt">
            <option value="cse">CSE</option>
            <option value="civil">Civil</option>
            <option value="entc">E&TC</option>
            <option value="mech">Mechanical</option>
          </select>

          <label for="mail">Email:</label>
          <input type="text" placeholder="Enter your email" />

          <label for="numbee">Phone:</label>
          <input type="number" placeholder="Enter your phone number" />
        </form>
      </td>
    </tr>
  </table>

</body>
</html>
