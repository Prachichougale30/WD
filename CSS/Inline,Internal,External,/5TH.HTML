<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5TH ASSIGNMENT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 🌑 Dark theme with vibrant colors */
    body {
      background-color: #1a1a1a;
      color: #f1f1f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #00bfff;
      background-color: #111;
      padding: 15px;
      border-radius: 10px;
      text-shadow: 2px 2px 4px #000;
    }

    h4 {
      color: #ff6ec7;
      margin-top: 10px;
    }

    h3 {
      color: #ff4500;
      background-color: #2c2c2c;
      padding: 10px;
      border-radius: 10px;
      font-family: fantasy;
      margin-top: 20px;
    }

    img {
      margin: 10px;
      border: 4px solid #333;
      border-radius: 12px;
      box-shadow: 0px 0px 15px 4px #444;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0px 0px 20px 6px #00bfff;
    }

    marquee {
      color: #00ffff;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <marquee behavior="scroll" direction="left">USING THE IMAGE TAG</marquee>

</body>
</html>
